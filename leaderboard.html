<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fact Feud — Leaderboard</title>
<link rel="stylesheet" href="factfeud.css">
<style>
  .board-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:1rem; margin-top:1rem; }
  @media (max-width:760px) { .board-grid { grid-template-columns:1fr; } }
  .set-card h3 { margin:.1rem 0 .6rem; font-size:1.2rem; }
  .set-card .empty { font-size:.85rem; }
</style>
</head>
<body>
<div class="ff-shell">
  <div class="ff-topbar">
    <a href="index.html" style="text-decoration:none"><div class="ff-badge small"><span class="line">Fact</span><span class="line">Feud</span></div></a>
    <span class="eyebrow">Leaderboard</span>
    <span class="spacer"></span>
    <button class="ghost" id="refreshBtn">↻ Refresh</button>
    <a class="btn" href="index.html" style="text-decoration:none">☰ Menu</a>
  </div>

  <h2>Top scores, by Question Set</h2>
  <p class="muted">Solo mode only — the top 5 saved scores for each Question Set. Play Solo and save your score to get a shot at the board.</p>

  <div class="board-grid" id="grid">
    <p class="muted">Loading…</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  async function load() {
    $('grid').innerHTML = '<p class="muted">Loading…</p>';
    if (!FF.sb) { $('grid').innerHTML = '<p class="muted">No connection — try again in a moment.</p>'; return; }
    const [g, h] = await Promise.all([
      FF.sb.from('ff_games').select('id,name').order('name'),
      FF.sb.from('ff_highscores').select('game_id,player_name,score').order('score', { ascending:false }),
    ]);
    if (g.error || h.error) { $('grid').innerHTML = '<p class="muted">Couldn\'t load the leaderboard right now.</p>'; return; }

    const byGame = {};
    for (const row of h.data) {
      (byGame[row.game_id] ||= []).push(row);
    }

    $('grid').innerHTML = g.data.map(set => {
      const top5 = (byGame[set.id] || []).slice(0, 5);
      const rows = top5.length
        ? top5.map((r, i) => `<tr><td class="rank">${i+1}</td><td>${esc(r.player_name)}</td><td>${r.score}</td></tr>`).join('')
        : `<tr><td colspan="3" class="muted empty">No scores yet — be the first!</td></tr>`;
      return `<div class="tile quiet set-card">
        <h3>${esc(set.name)}</h3>
        <table class="board"><thead><tr><th>#</th><th>Name</th><th>Score</th></tr></thead>
        <tbody>${rows}</tbody></table>
      </div>`;
    }).join('') || '<p class="muted">No Question Sets yet.</p>';
  }

  $('refreshBtn').addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
